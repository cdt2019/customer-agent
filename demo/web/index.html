<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示例商店</title>
<link rel="stylesheet" href="/web/shop.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-lang" viewBox="0 0 24 24"><path d="M4 5h9M8.5 3v2M6 5c1 4 3.5 7 7 8.5M11 5c-1 4-3.500 7-7 8.500M13 21l4-9 4 9M14.300 18h5.400"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.500 8-8 9-4.500-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-headset" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.500"/><rect x="17" y="14" width="4" height="6" rx="1.500"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
</svg>

<div class="util"><div class="in">
  <a href="#help">帮助中心</a>
  <a href="#support">联系客服</a>
</div></div>

<header class="top">
  <div class="in">
    <a class="logo" href="#home"><span class="mark" aria-hidden="true"></span><b id="shopName"></b><small id="shopBrand"></small></a>
    <a class="cats" href="#home"><svg class="i"><use href="#i-grid"/></svg>全部分类<svg class="i s"><use href="#i-down"/></svg></a>
    <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索商品"></label>
    <nav class="links" id="links">
      <a href="#orders">查订单</a>
      <a href="#help">帮助</a>
      <a href="#support">在线客服</a>
    </nav>
    <div class="who" id="who" role="group" aria-label="切换身份">
      <button data-who="guest">游客</button>
      <button data-who="member-a">会员甲</button>
      <button data-who="member-b">会员乙</button>
    </div>
    <button class="lang" id="lang"><svg class="i"><use href="#i-lang"/></svg><span></span></button>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-home">
    <div class="hero">
      <div class="catlist" id="catList"></div>
      <div class="banner">
        <small>付款秒到账</small>
        <h1>数字会员和礼品卡，付款即到账</h1>
        <p>付款后自动交付卡密，质保期内补发或退款。</p>
        <div class="acts"><a class="btn primary" href="#products/0">开始选购</a><a class="btn" href="#orders">查订单</a></div>
      </div>
      <div class="me" id="meCard"></div>
    </div>
    <div class="trust">
      <div><span><svg class="i"><use href="#i-bolt"/></svg></span><b>自动发货</b><small>付款后秒到订单页</small></div>
      <div><span><svg class="i"><use href="#i-shield"/></svg></span><b>质保可售后</b><small>期内补发或退款</small></div>
      <div><span><svg class="i"><use href="#i-headset"/></svg></span><b>12 小时回复</b><small>在订单里发起售后</small></div>
      <div><span><svg class="i"><use href="#i-lock"/></svg></span><b>不收账号密码</b><small>只发卡密和兑换码</small></div>
    </div>
    <div class="sec"><div><h2>热卖</h2><small>近 7 天卖得最多</small></div></div>
    <div class="grid" id="grid"></div>
  </section>
  <section class="view" id="v-products"><div class="box detail" id="detail"></div></section>
  <section class="view" id="v-orders"><div class="box"><h2 class="title">我的订单</h2><div id="orderList"></div></div></section>
  <section class="view" id="v-help"><div class="box"><h2 class="title">帮助中心</h2><div id="helpList"></div></div></section>
  <section class="view" id="v-support"><div class="fullchat" id="fullHost"></div></section>
</main>

<script src="/widget/widget.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
