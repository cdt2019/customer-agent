<!doctype html>

<title>导入和解析 · 效果图</title>
<style>
  :root {
    --ink: #14172b; --ink-2: #545a78; --ink-3: #8e93ad;
    --blue: #2d5bff; --blue-deep: #1b3fe0; --blue-soft: #e8edff;
    --chip: #eceefa; --card: #ffffff; --tile: #f6f7fd; --hair: rgba(38, 48, 110, .07);
    --up: #12996a; --down: #e0475c;
    --shadow: 0 1px 2px rgba(38, 48, 110, .04), 0 12px 32px -14px rgba(38, 48, 110, .18);
    --shadow-blue: 0 14px 26px -12px rgba(36, 76, 245, .6);
    --num: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); overflow: hidden;
    font: 14px/1.55 "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    background: linear-gradient(180deg, #c6cbf0 0, #dfe2f7 150px, #f3f4fc 340px, #fafbff 100%) fixed;
    -webkit-font-smoothing: antialiased;
  }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .app { display: grid; --nav: 232px; --chat: 410px; grid-template-columns: var(--nav) var(--chat) minmax(0, 1fr); height: 100vh; }

  /* 左侧菜单 */
  .rail { height: 100vh; min-width: 0; background: rgba(255, 255, 255, .66); backdrop-filter: blur(16px); border-right: 1px solid rgba(38, 48, 110, .08); display: flex; flex-direction: column; padding: 14px 10px 10px; position: relative; z-index: 3; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 4px 12px 6px; }
  .logo { width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(145deg, #4a76ff, var(--blue-deep)); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 14px -7px rgba(36, 76, 245, .7); flex: none; }
  .logo svg.i { width: 16px; height: 16px; }
  .brand b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .navbtn { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-3); flex: none; }
  .navbtn:hover { background: var(--chip); color: var(--ink); }
  .navbtn svg.i { width: 17px; height: 17px; }
  .proj { width: 100%; display: flex; align-items: center; gap: 9px; text-align: left; background: #fff; border-radius: 13px; padding: 7px 9px; box-shadow: 0 1px 2px rgba(38, 48, 110, .06), 0 6px 14px -10px rgba(38, 48, 110, .3); margin-bottom: 8px; }
  .proj i { width: 28px; height: 28px; border-radius: 9px; background: var(--blue-soft); color: var(--blue); font-style: normal; font-weight: 700; font-size: 13px; display: grid; place-items: center; flex: none; }
  .proj span { flex: 1; min-width: 0; font-size: 11px; color: var(--ink-3); line-height: 1.25; }
  .proj b { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj > svg.i { width: 14px; height: 14px; color: var(--ink-3); }
  .menu { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .menu h6 { margin: 12px 8px 3px; font-size: 11px; line-height: 1.5; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
  .rail a { position: relative; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; margin-bottom: 2px; border-radius: 11px; color: var(--ink-2); text-decoration: none; white-space: nowrap; transition: background .12s, color .12s; }
  .rail a svg.i { width: 17px; height: 17px; stroke-width: 1.8; }
  .rail a:hover { background: rgba(38, 48, 110, .05); color: var(--ink); }
  .rail a:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  .rail a.on { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .rail a em { margin-left: auto; font-style: normal; font-size: 10.5px; font-weight: 400; color: var(--ink-3); background: var(--chip); border-radius: 6px; padding: 0 5px; }
  .dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 8px 0; }
  .dock button { height: 32px; border-radius: 10px; background: #fff; color: var(--ink-2); display: grid; place-items: center; box-shadow: 0 1px 2px rgba(38, 48, 110, .07); }
  .dock button:hover { color: var(--blue); }
  .dock svg.i { width: 16px; height: 16px; }
  .me-card { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 13px; padding: 7px 9px; font-size: 13px; color: var(--ink-2); box-shadow: 0 1px 2px rgba(38, 48, 110, .06); }
  .me-card i { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(145deg, #4a76ff, var(--blue-deep)); color: #fff; font-style: normal; font-size: 12px; font-weight: 600; display: grid; place-items: center; flex: none; }
  .me-card span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me-card small { font-size: 10.5px; font-weight: 600; color: var(--ink-3); }

  .app.navfold .rail { padding: 14px 9px 10px; align-items: center; }
  .app.navfold .brand { flex-direction: column; padding: 0 0 8px; }
  .app.navfold .brand b, .app.navfold .proj span, .app.navfold .proj > svg.i, .app.navfold .menu h6, .app.navfold .rail a em, .app.navfold .me-card span, .app.navfold .me-card small { display: none; }
  .app.navfold .proj { width: 40px; padding: 6px; justify-content: center; }
  .app.navfold .menu { width: 100%; overflow: visible; }
  .app.navfold .menu .grp + .grp { border-top: 1px solid var(--hair); margin-top: 6px; padding-top: 6px; }
  .app.navfold .rail a { width: 36px; padding: 0; margin-inline: auto; justify-content: center; }
  .app.navfold .rail a span { position: absolute; left: 44px; top: 50%; transform: translateY(-50%); background: var(--ink); color: #fff; font-size: 12px; font-weight: 400; line-height: 1; padding: 6px 8px; border-radius: 7px; opacity: 0; pointer-events: none; transition: opacity .1s; }
  .app.navfold .rail a:hover span, .app.navfold .rail a:focus-visible span { opacity: 1; }
  .app.navfold .dock { grid-template-columns: 1fr; width: 34px; }
  .app.navfold .dock button:not(.keep) { display: none; }
  .app.navfold .me-card { padding: 4px; }

  
  .app { grid-template-columns: var(--nav) minmax(0, 1fr); }
  .page { height: 100vh; min-width: 0; display: flex; flex-direction: column; padding: 14px 20px; }
  .head { flex: none; display: flex; align-items: center; gap: 8px; margin: 2px 2px 12px; flex-wrap: wrap; }
  .head h1 { font-size: 22px; line-height: 1.2; margin: 0 6px 0 0; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .pick { background: rgba(255, 255, 255, .72); border-radius: 12px; height: 34px; padding: 0 12px; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .pick b { color: var(--ink); font-weight: 600; }
  .pick svg.i { width: 14px; height: 14px; }
  .pick.sel { background: #fff; color: var(--blue); font-weight: 600; box-shadow: 0 1px 2px rgba(38, 48, 110, .08); }
  .sp { flex: 1; }
  .primary { height: 36px; padding: 0 20px; border-radius: 12px; color: #fff; font-weight: 600; background: linear-gradient(100deg, #4170ff, var(--blue-deep)); box-shadow: 0 10px 18px -10px rgba(36, 76, 245, .75); white-space: nowrap; }
  .primary:active { transform: translateY(1px); }
  .strip { flex: none; display: grid; gap: 9px; height: 72px; margin-bottom: 12px; }
  .mini { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); min-width: 0; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .mini > span { font-size: 11.5px; color: var(--ink-3); line-height: 1.35; white-space: nowrap; }
  .mini b { font-family: var(--num); font-size: 19px; line-height: 1.25; font-weight: 700; white-space: nowrap; }
  .mini b small { font-size: 11px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
  .mini.hero { color: #fff; background: radial-gradient(120% 160% at 88% 0, #6f92ff 0, transparent 56%), linear-gradient(105deg, #2f5eff, var(--blue-deep)); box-shadow: 0 12px 20px -12px rgba(36, 76, 245, .7); }
  .mini.hero > span { color: rgba(255, 255, 255, .85); }
  .mini.hero b small { color: rgba(255, 255, 255, .85); }
  .panel { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .tabs { display: flex; gap: 24px; padding: 13px 20px 0; border-bottom: 1px solid var(--hair); flex: none; overflow-x: auto; }
  .tab { padding: 2px 1px 9px; font-size: 14px; color: var(--ink-3); border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab:hover { color: var(--ink-2); }
  .tab.on { color: var(--blue); border-color: var(--blue); font-weight: 600; }
  .c { background: var(--chip); color: var(--ink-2); border-radius: 8px; padding: 0 8px; font-size: 12px; white-space: nowrap; }
  .note { flex: none; margin: 8px 2px 0; font-size: 11.5px; color: var(--ink-3); }
  .scroll { overflow: auto; flex: 1; min-height: 0; }

  .seg-ctl { display: inline-flex; background: var(--chip); border-radius: 11px; padding: 3px; gap: 2px; }
  .seg-ctl button { height: 28px; padding: 0 11px; border-radius: 8px; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
  .seg-ctl button.on { background: #fff; color: var(--blue); font-weight: 600; box-shadow: 0 1px 3px rgba(38, 48, 110, .14); }
  .state { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .s-run { color: var(--blue); } .s-ok { color: var(--up); } .s-bad { color: var(--down); } .s-wait { color: var(--ink-3); } .s-check { color: #9a6200; }
  .btn2 { height: 32px; padding: 0 12px; border-radius: 10px; background: var(--chip); color: var(--ink-2); font-size: 13px; white-space: nowrap; }
  .btn2:hover { background: var(--blue-soft); color: var(--blue); }

  .strip { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .work { flex: 1; min-height: 0; display: grid; grid-template-columns: 318px minmax(0, 1fr); gap: 12px; }
  .drop { margin: 12px; flex: none; border: 1.5px dashed #b7c4f5; border-radius: 18px; background: #f5f7ff; padding: 16px 12px; text-align: center; color: var(--ink-2); width: calc(100% - 24px); display: block; transition: background .1s, border-color .1s; }
  .drop:hover, .drop.over { background: var(--blue-soft); border-color: var(--blue); }
  .drop .ic { width: 38px; height: 38px; border-radius: 13px; margin: 0 auto 6px; background: linear-gradient(145deg, #4a76ff, var(--blue-deep)); color: #fff; display: grid; place-items: center; }
  .drop b { display: block; color: var(--ink); font-weight: 600; }
  .drop small { font-size: 12px; color: var(--ink-3); }
  .files { padding: 0 8px 8px; }
  .file { width: 100%; text-align: left; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 0 9px; align-items: center; padding: 8px 10px; border-radius: 14px; margin-bottom: 3px; }
  .file:hover { background: var(--tile); }
  .file.on { background: var(--blue-soft); }
  .ext { grid-row: span 2; width: 34px; height: 34px; border-radius: 10px; background: #fff; box-shadow: 0 1px 3px rgba(38, 48, 110, .12); display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--blue); }
  .file b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file small { grid-column: 2; color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file .state { grid-row: 1 / 3; grid-column: 3; }
  .bar2 { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 18px 10px; border-bottom: 1px solid var(--hair); flex-wrap: wrap; }
  .bar2 h2 { margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .checks { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 9px 18px; border-bottom: 1px solid var(--hair); }
  .c.bad { background: #fff3da; color: #9a6200; }
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .side { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .side + .side { border-left: 1px solid var(--hair); }
  .side h3 { flex: none; margin: 0; padding: 9px 18px 5px; font-size: 12.5px; color: var(--ink-3); font-weight: 600; display: flex; align-items: center; }
  .side h3 span { margin-left: auto; font-weight: 400; }
  .sheet-wrap { background: #eef0f8; padding: 12px 16px; }
  .sheet { background: #fff; border-radius: 4px; box-shadow: 0 2px 10px rgba(38, 48, 110, .14); padding: 22px 24px; font-size: 12.5px; line-height: 1.7; color: #2b2e42; min-height: 100%; }
  .sheet .hf { color: #9a9db0; font-size: 11px; display: flex; justify-content: space-between; }
  .sheet h4 { margin: 10px 0 4px; font-size: 16px; } .sheet h5 { margin: 10px 0 2px; font-size: 13.5px; } .sheet p { margin: 0 0 6px; }
  .sheet table { border-collapse: collapse; width: 100%; margin: 6px 0; } .sheet td, .sheet th { border: 1px solid #cfd2e0; padding: 2px 6px; text-align: left; font-weight: 400; }
  .sheet th { background: #f2f3f9; font-weight: 600; }
  .md { flex: 1; min-height: 0; width: 100%; border: 0; outline: 0; resize: none; padding: 8px 18px 14px; background: #fbfbfe; font: 13px/1.75 ui-monospace, "Cascadia Mono", Consolas, "Microsoft YaHei UI", monospace; color: var(--ink); }
  .foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 18px; border-top: 1px solid var(--hair); }
  .foot span { color: var(--ink-3); font-size: 12.5px; }
  @media (max-width: 1240px) { .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 58px; height: auto; } .work { grid-template-columns: 250px minmax(0, 1fr); } }
  @media (max-width: 860px) { body { overflow: auto; } .app { height: auto; } .rail { position: sticky; top: 0; } .page { height: auto; } .work { grid-template-columns: minmax(0, 1fr); } .split { grid-template-columns: minmax(0, 1fr); } .md { min-height: 320px; } }

</style>
</head>

      <div class="grp">
        <h6>客服运营</h6>
        <a href="#"><svg class="i"><use href="#chat"/></svg><span>会话记录</span><em>第二步</em></a>
        <a href="#"><svg class="i"><use href="#headset"/></svg><span>转人工</span><em>第二步</em></a>
      </div>
      <div class="grp">
        <h6>用量与接入</h6>
        <a href="#"><svg class="i"><use href="#coin"/></svg><span>用量和花费</span><em>第二步</em></a>
        <a href="#"><svg class="i"><use href="#plug"/></svg><span>接入方</span></a>
      </div>
    </div>
    <div class="dock">
      <button aria-label="通知" title="通知"><svg class="i"><use href="#bell"/></svg></button>
      <button class="keep" aria-label="设置" title="设置"><svg class="i"><use href="#gear"/></svg></button>
      <button aria-label="搜索" title="搜索"><svg class="i"><use href="#find"/></svg></button>
      <button aria-label="接口密钥" title="接口密钥"><svg class="i"><use href="#lock"/></svg></button>
    </div>
    <div class="me-card"><i>管</i><span>管理员</span><small>本地</small></div>
  </nav>
  <main class="page">
    <div class="head">
      <h1>导入和解析</h1>
      <button class="pick">导入到 <b>示例商店 · 帮助</b><svg class="i"><use href="#down"/></svg></button>
      <span class="sp"></span>
      <a class="pick" href="jobs.html" style="text-decoration:none">查看任务</a>
      <button class="primary" id="allOk">确认全部</button>
    </div>
    <div class="strip">
      <div class="mini"><span>本批文件</span><b id="nAll"></b></div>
      <div class="mini"><span>待确认</span><b id="nCheck"></b></div>
      <div class="mini"><span>解析中</span><b id="nRun"></b></div>
      <div class="mini"><span>失败</span><b id="nBad"></b></div>
      <div class="mini hero"><span>默认解析器</span><b>Docling</b></div>
    </div>
    <div class="work">
      <section class="panel">
        <button class="drop" id="drop"><span class="ic" style="display:grid"><svg class="i"><use href="#upload"/></svg></span><b>拖入文件，或点击选择</b><small>Markdown、TXT、HTML、Word、文字型 PDF</small></button>
        <input type="file" id="picker" multiple accept=".md,.txt,.html,.htm,.docx,.pdf" hidden>
        <div class="files scroll" id="files"></div>
      </section>
      <section class="panel">
        <div class="bar2">
          <h2 id="fname"></h2><span class="state" id="fstate"></span><span class="sp"></span>
          <div class="seg-ctl" id="parser" role="group" aria-label="解析器"><button data-p="auto">自带</button><button data-p="docling" class="on">Docling</button><button data-p="mineru" disabled title="以后接入" style="opacity:.5">MinerU</button></div>
          <button class="btn2" id="reparse">重新解析</button>
        </div>
        <div class="checks" id="checks"></div>
        <div class="split">
          <div class="side"><h3>原文件<span id="pg"></span></h3><div class="sheet-wrap scroll"><div class="sheet" id="sheet"></div></div></div>
          <div class="side"><h3>解析结果 · Markdown<span>可以直接修改</span></h3><textarea class="md" id="md" aria-label="解析结果"></textarea></div>
        </div>
        <div class="foot"><label style="display:inline-flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="clean" checked> 去掉页眉页脚</label><span id="saved"></span><span class="sp" style="flex:1"></span><button class="btn2" id="skip">跳过这份</button><button class="primary" id="ok">确认，开始切块</button></div>
      </section>
    </div>
    <p class="note">效果图：文件和解析结果都是示意，没有真的解析。</p>
  </main>
</div>
<script>
  function setNav(folded) {
    document.querySelector('.app').classList.toggle('navfold', folded);
    var b = document.getElementById('navfold'), label = folded ? '展开菜单' : '收起菜单';
    b.setAttribute('aria-expanded', !folded); b.setAttribute('aria-label', label); b.title = label;
  }
  document.getElementById('navfold').addEventListener('click', function () { setNav(!document.querySelector('.app').classList.contains('navfold')); });
  setNav(window.innerWidth < 1240);


  var $ = function (id) { return document.getElementById(id); };
  var header = '<!-- 页眉：示例数字商店 售后手册 -->\n';
  var sample = '# 售后处理手册\n\n## 质保范围\n\n质保期从交付时间开始计算。不同商品的质保天数如下：\n\n| 商品 | 质保 | 补发次数 |\n|---|---|---|\n| Plus 月卡 | 30 天 | 2 次 |\n| Go 月卡 | 30 天 | 2 次 |\n| 礼品卡 | 未使用可换 | 1 次 |\n\n## 申请流程\n\n在订单页点「申请售后」，选择类型并说明情况，可以附截图。\n\n## 不在质保内的情况\n\n卡密已被使用且无法证明异常时，由客服核对后判断。\n';
  var files = [
    { n: '售后处理手册.pdf', e: 'PDF', size: '1.2 MB · 8 页', st: 'check', md: sample, checks: ['标题 4 个', '表格 1 张', '正文 1,860 字'], warn: ['第 6 页文字很少，可能是图片'] },
    { n: '新手使用教程.docx', e: 'DOC', size: '860 KB · 12 页', st: 'check', md: '# 新手使用教程\n\n## 付款后去哪里拿卡密\n\n付款到账后，卡密显示在订单页，同时发到下单邮箱。\n\n## 怎么兑换\n\n打开兑换页，输入兑换码和账号信息，按提示完成开通。\n', checks: ['标题 3 个', '图片 4 张', '正文 3,240 字'], warn: [] },
    { n: '常见问题.md', e: 'MD', size: '24 KB', st: 'ok', md: '# 常见问题\n\n## 支持哪些付款方式\n\n支持支付宝、微信、USDT 和账户余额。\n', checks: ['标题 18 个', '正文 5,120 字'], warn: [] },
    { n: '产品更新说明.html', e: 'HTML', size: '310 KB', st: 'run', md: '', checks: [], warn: [] },
    { n: '扫描版合同.pdf', e: 'PDF', size: '6.4 MB · 21 页', st: 'bad', md: '', checks: [], warn: ['这份 PDF 没有文字层，是扫描件。第一版不支持，可以以后用 MinerU 解析'] }
  ];
  var labels = { check: '待确认', ok: '已确认', run: '解析中', bad: '失败', wait: '排队' };
  var cls = { check: 's-check', ok: 's-ok', run: 's-run', bad: 's-bad', wait: 's-wait' };
  var cur = 0;

  function count() {
    var c = function (s) { return files.filter(function (f) { return f.st === s; }).length; };
    $('nAll').innerHTML = files.length + '<small>份</small>'; $('nCheck').innerHTML = c('check') + '<small>份</small>';
    $('nRun').innerHTML = c('run') + '<small>份</small>'; $('nBad').innerHTML = c('bad') + '<small>份</small>';
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function renderFiles() {
    $('files').innerHTML = files.map(function (f, i) {
      return '<button class="file' + (i === cur ? ' on' : '') + '" data-i="' + i + '"><span class="ext">' + f.e + '</span><b>' + esc(f.n) + '</b><span class="state ' + cls[f.st] + '">' + labels[f.st] + '</span><small>' + f.size + '</small></button>';
    }).join('');
    count();
  }
  function sheet(f) {
    if (f.st === 'run') return '<p style="color:var(--ink-3)">正在解析…</p>';
    if (f.st === 'bad') return '<p style="color:var(--ink-3)">这是一份扫描件，页面是图片，取不到文字。</p><div style="height:220px;border-radius:4px;background:repeating-linear-gradient(0deg,#eceef6 0 2px,#fff 2px 15px)"></div>';
    var out = '<div class="hf"><span>示例数字商店 售后手册</span><span>第 1 页</span></div>', rows = [];
    f.md.split('\n').forEach(function (l) {
      if (/^\|/.test(l)) { if (!/^\|-/.test(l)) rows.push(l.split('|').slice(1, -1)); return; }
      if (rows.length) { out += '<table>' + rows.map(function (r, n) { return '<tr>' + r.map(function (c) { return n ? '<td>' + esc(c) + '</td>' : '<th>' + esc(c) + '</th>'; }).join('') + '</tr>'; }).join('') + '</table>'; rows = []; }
      if (/^# /.test(l)) out += '<h4>' + esc(l.slice(2)) + '</h4>';
      else if (/^## /.test(l)) out += '<h5>' + esc(l.slice(3)) + '</h5>';
      else if (l) out += '<p>' + esc(l) + '</p>';
    });
    return out + '<div class="hf" style="margin-top:12px"><span>内部资料</span><span>1 / 8</span></div>';
  }
  function renderFile() {
    var f = files[cur], locked = f.st === 'run' || f.st === 'bad';
    $('fname').textContent = f.n; $('fstate').textContent = labels[f.st]; $('fstate').className = 'state ' + cls[f.st];
    $('pg').textContent = f.size;
    $('checks').innerHTML = f.checks.map(function (c) { return '<span class="c">' + c + '</span>'; }).join('') + f.warn.map(function (c) { return '<span class="c bad">' + esc(c) + '</span>'; }).join('') || '<span class="c">等待解析结果</span>';
    $('sheet').innerHTML = sheet(f);
    $('md').value = ($('clean').checked || !f.md ? '' : header) + f.md;
    $('md').disabled = locked; $('ok').disabled = locked || f.st === 'ok'; $('ok').style.opacity = $('ok').disabled ? .45 : 1;
    $('ok').textContent = f.st === 'ok' ? '已确认' : '确认，开始切块'; $('saved').textContent = '';
  }
  function pick(i) { cur = i; renderFiles(); renderFile(); }
  $('files').addEventListener('click', function (e) { var b = e.target.closest('.file'); if (b) pick(+b.dataset.i); });
  $('md').addEventListener('input', function () { files[cur].md = this.value.replace(header, ''); $('saved').textContent = '修改已保存'; });
  $('clean').addEventListener('change', renderFile);
  $('ok').addEventListener('click', function () {
    files[cur].st = 'ok';
    var next = files.findIndex(function (f) { return f.st === 'check'; });
    pick(next >= 0 ? next : cur);
  });
  $('skip').addEventListener('click', function () {
    if (files.length < 2) return;
    files.splice(cur, 1); pick(Math.min(cur, files.length - 1));
  });
  $('allOk').addEventListener('click', function () { files.forEach(function (f) { if (f.st === 'check') f.st = 'ok'; }); renderFiles(); renderFile(); });
  $('parser').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
  });
  $('reparse').addEventListener('click', function () {
    var f = files[cur]; if (f.st === 'bad') return;
    var old = f.st, b = this; f.st = 'run'; b.disabled = true; renderFiles(); renderFile();
    setTimeout(function () { f.st = old === 'run' ? 'check' : old; if (!f.md) { f.md = '# ' + f.n.replace(/\.[^.]+$/, '') + '\n\n解析出来的内容。\n'; f.checks = ['标题 1 个']; } b.disabled = false; renderFiles(); renderFile(); }, 700);
  });
  $('drop').addEventListener('click', function () { $('picker').click(); });
  function add(list) {
    Array.prototype.forEach.call(list, function (x) {
      var ext = (x.name.split('.').pop() || '').toUpperCase().slice(0, 4);
      var f = { n: x.name, e: ext, size: Math.max(1, Math.round(x.size / 1024)) + ' KB', st: 'run', md: '', checks: [], warn: [] };
      files.unshift(f);
      setTimeout(function () { f.st = 'check'; f.md = '# ' + x.name.replace(/\.[^.]+$/, '') + '\n\n效果图没有真的解析，这里是示意内容。\n'; f.checks = ['标题 1 个']; renderFiles(); renderFile(); }, 900);
    });
    pick(0);
  }
  $('picker').addEventListener('change', function () { add(this.files); this.value = ''; });
  ['dragenter', 'dragover'].forEach(function (t) { $('drop').addEventListener(t, function (e) { e.preventDefault(); this.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (t) { $('drop').addEventListener(t, function (e) { e.preventDefault(); this.classList.remove('over'); }); });
  $('drop').addEventListener('drop', function (e) { add(e.dataTransfer.files); });
  renderFiles(); renderFile();

</script>
</body>
</html>
