<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>检索测试台 · 效果图</title>
<style>
  :root {
    --ink: #14172b; --ink-2: #545a78; --ink-3: #8e93ad;
    --blue: #2d5bff; --blue-deep: #1b3fe0; --blue-soft: #e8edff;
    --chip: #eceefa; --card: #ffffff; --tile: #f6f7fd; --hair: rgba(38, 48, 110, .07);
    --up: #12996a; --down: #e0475c;
    --shadow: 0 1px 2px rgba(38, 48, 110, .04), 0 12px 32px -14px rgba(38, 48, 110, .18);
    --shadow-blue: 0 14px 26px -12px rgba(36, 76, 245, .6);
    --num: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); overflow: hidden;
    font: 14px/1.55 "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    background: linear-gradient(180deg, #c6cbf0 0, #dfe2f7 150px, #f3f4fc 340px, #fafbff 100%) fixed;
    -webkit-font-smoothing: antialiased;
  }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .app { display: grid; --nav: 232px; --chat: 410px; grid-template-columns: var(--nav) var(--chat) minmax(0, 1fr); height: 100vh; }

  /* 左侧菜单 */
  .rail { height: 100vh; min-width: 0; background: rgba(255, 255, 255, .66); backdrop-filter: blur(16px); border-right: 1px solid rgba(38, 48, 110, .08); display: flex; flex-direction: column; padding: 14px 10px 10px; position: relative; z-index: 3; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 4px 12px 6px; }
  .logo { width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(145deg, #4a76ff, var(--blue-deep)); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 14px -7px rgba(36, 76, 245, .7); flex: none; }
  .logo svg.i { width: 16px; height: 16px; }
  .brand b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .navbtn { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-3); flex: none; }
  .navbtn:hover { background: var(--chip); color: var(--ink); }
  .navbtn svg.i { width: 17px; height: 17px; }
  .proj { width: 100%; display: flex; align-items: center; gap: 9px; text-align: left; background: #fff; border-radius: 13px; padding: 7px 9px; box-shadow: 0 1px 2px rgba(38, 48, 110, .06), 0 6px 14px -10px rgba(38, 48, 110, .3); margin-bottom: 8px; }
  .proj i { width: 28px; height: 28px; border-radius: 9px; background: var(--blue-soft); color: var(--blue); font-style: normal; font-weight: 700; font-size: 13px; display: grid; place-items: center; flex: none; }
  .proj span { flex: 1; min-width: 0; font-size: 11px; color: var(--ink-3); line-height: 1.25; }
  .proj b { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj > svg.i { width: 14px; height: 14px; color: var(--ink-3); }
  .menu { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .menu h6 { margin: 12px 8px 3px; font-size: 11px; line-height: 1.5; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
  .rail a { position: relative; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; margin-bottom: 2px; border-radius: 11px; color: var(--ink-2); text-decoration: none; white-space: nowrap; transition: background .12s, color .12s; }
  .rail a svg.i { width: 17px; height: 17px; stroke-width: 1.8; }
  .rail a:hover { background: rgba(38, 48, 110, .05); color: var(--ink); }
  .rail a:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  .rail a.on { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .rail a em { margin-left: auto; font-style: normal; font-size: 10.5px; font-weight: 400; color: var(--ink-3); background: var(--chip); border-radius: 6px; padding: 0 5px; }
  .dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 8px 0; }
  .dock button { height: 32px; border-radius: 10px; background: #fff; color: var(--ink-2); display: grid; place-items: center; box-shadow: 0 1px 2px rgba(38, 48, 110, .07); }
  .dock button:hover { color: var(--blue); }
  .dock svg.i { width: 16px; height: 16px; }
  .me-card { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 13px; padding: 7px 9px; font-size: 13px; color: var(--ink-2); box-shadow: 0 1px 2px rgba(38, 48, 110, .06); }
  .me-card i { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(145deg, #4a76ff, var(--blue-deep)); color: #fff; font-style: normal; font-size: 12px; font-weight: 600; display: grid; place-items: center; flex: none; }
  .me-card span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me-card small { font-size: 10.5px; font-weight: 600; color: var(--ink-3); }

  .app.navfold .rail { padding: 14px 9px 10px; align-items: center; }
  .app.navfold .brand { flex-direction: column; padding: 0 0 8px; }
  .app.navfold .brand b, .app.navfold .proj span, .app.navfold .proj > svg.i, .app.navfold .menu h6, .app.navfold .rail a em, .app.navfold .me-card span, .app.navfold .me-card small { display: none; }
  .app.navfold .proj { width: 40px; padding: 6px; justify-content: center; }
  .app.navfold .menu { width: 100%; overflow: visible; }
  .app.navfold .menu .grp + .grp { border-top: 1px solid var(--hair); margin-top: 6px; padding-top: 6px; }
  .app.navfold .rail a { width: 36px; padding: 0; margin-inline: auto; justify-content: center; }
  .app.navfold .rail a span { position: absolute; left: 44px; top: 50%; transform: translateY(-50%); background: var(--ink); color: #fff; font-size: 12px; font-weight: 400; line-height: 1; padding: 6px 8px; border-radius: 7px; opacity: 0; pointer-events: none; transition: opacity .1s; }
  .app.navfold .rail a:hover span, .app.navfold .rail a:focus-visible span { opacity: 1; }
  .app.navfold .dock { grid-template-columns: 1fr; width: 34px; }
  .app.navfold .dock button:not(.keep) { display: none; }
  .app.navfold .me-card { padding: 4px; }

  /* 对话区 */
  .chat { display: flex; flex-direction: column; min-width: 0; height: 100vh; padding: 14px 16px; }
  .head { display: flex; align-items: center; gap: 8px; margin: 2px 4px 10px; flex: none; }
  .head h1 { font-size: 22px; line-height: 1.2; margin: 0 auto 0 0; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .pick { background: rgba(255, 255, 255, .72); border-radius: 12px; padding: 6px 12px; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .pick b { color: var(--ink); font-weight: 600; }
  .pick svg.i { width: 14px; height: 14px; }

  .msgs { flex: 1; min-height: 0; overflow: auto; padding: 8px 6px 14px; scroll-behavior: smooth; }
  .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .me { align-self: flex-end; max-width: 78%; color: #fff; padding: 10px 16px; border-radius: 20px 20px 6px 20px; background: linear-gradient(110deg, #4170ff, var(--blue-deep)); box-shadow: var(--shadow-blue); white-space: pre-wrap; overflow-wrap: anywhere; }
  .ai { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
  .ava { width: 36px; height: 36px; border-radius: 12px; background: #fff; color: var(--blue); display: grid; place-items: center; box-shadow: var(--shadow); }
  .ava svg.i { width: 19px; height: 19px; }
  .bub { background: var(--card); border-radius: 6px 22px 22px 22px; box-shadow: var(--shadow); padding: 13px 18px 11px; border: 1.5px solid transparent; transition: border-color .12s; }
  .turn.sel .bub { border-color: #a9bcff; }
  .bub p { margin: 0 0 8px; line-height: 1.75; }
  .cite { display: inline-grid; place-items: center; min-width: 17px; height: 17px; border-radius: 6px; background: var(--blue-soft); color: var(--blue); font-size: 11px; font-weight: 700; margin-left: 2px; vertical-align: 1px; }
  .cite:hover { background: var(--blue); color: #fff; }
  .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding-top: 9px; margin-top: 4px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--ink-3); }
  .trace { margin-left: auto; color: var(--blue); font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
  .trace svg.i { width: 13px; height: 13px; }
  .turn { display: flex; flex-direction: column; gap: 14px; }
  .dots { display: inline-flex; gap: 4px; padding: 6px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #a9bcff; animation: b 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; } .msgs { scroll-behavior: auto; } }

  /* 输入框 */
  .composer { flex: none; width: 100%; max-width: 772px; margin: 0 auto; background: var(--card); border-radius: 24px; box-shadow: 0 2px 4px rgba(38, 48, 110, .05), 0 18px 40px -16px rgba(38, 48, 110, .32); padding: 12px 12px 10px 18px; }
  .composer textarea { display: block; width: 100%; border: 0; outline: 0; resize: none; font: inherit; font-size: 15px; color: var(--ink); background: none; height: 46px; }
  .composer textarea::placeholder { color: var(--ink-3); }
  .tools { display: flex; align-items: center; gap: 5px; }
  .tg { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 9px; border-radius: 11px; background: var(--tile); color: var(--ink-3); font-size: 13px; white-space: nowrap; }
  .tg svg.i { display: none; }
  .tg.on { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .send { margin-left: auto; width: 42px; height: 42px; border-radius: 15px; background: linear-gradient(145deg, #4a76ff, var(--blue-deep)); color: #fff; display: grid; place-items: center; box-shadow: var(--shadow-blue); flex: none; }
  .send:active { transform: translateY(1px); }
  .send svg.i { width: 19px; height: 19px; }
  .note { flex: none; text-align: center; margin: 7px 0 0; font-size: 11.5px; color: var(--ink-3); }

  /* 检索过程：页面主角 */
  .insp { container: insp / inline-size; display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100vh; padding: 14px 18px 14px 0; }
  .ihead { flex: none; display: flex; align-items: center; margin: 2px 4px 10px; gap: 8px; min-width: 0; }
  .ihead h2 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .ihead .iq { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; margin-left: 6px; }
  .close { display: none; width: 30px; height: 30px; border-radius: 10px; background: var(--tile); place-items: center; flex: none; }
  .close svg.i { width: 15px; height: 15px; }

  .strip { flex: none; display: grid; grid-template-columns: minmax(150px, 1.35fr) minmax(128px, 1.15fr) repeat(4, minmax(0, 1fr)); gap: 9px; height: 72px; margin-bottom: 12px; }
  .strip .use { display: none; }
  .g, .mini { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); min-width: 0; }
  .g { display: flex; align-items: center; gap: 9px; padding: 0 12px; }
  .g svg { width: 50px; height: 28px; flex: none; overflow: visible; }
  .g div { min-width: 0; line-height: 1.25; }
  .g b { display: block; font-family: var(--num); font-size: 19px; font-weight: 700; }
  .g span { display: block; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; }
  .mini { padding: 0 12px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .mini > span { font-size: 11.5px; color: var(--ink-3); line-height: 1.35; white-space: nowrap; }
  .mini b { font-family: var(--num); font-size: 18px; line-height: 1.25; font-weight: 700; white-space: nowrap; }
  .mini b i { font-style: normal; }
  .mini b small { font-size: 11px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
  .mini.good b { color: var(--up); }
  .hero { border-radius: 18px; padding: 0 13px; color: #fff; display: flex; flex-direction: column; justify-content: center; min-width: 0; overflow: hidden; background: radial-gradient(120% 160% at 88% 0, #6f92ff 0, transparent 56%), linear-gradient(105deg, #2f5eff, var(--blue-deep)); box-shadow: 0 12px 20px -12px rgba(36, 76, 245, .7); }
  .hero span { font-size: 11.5px; opacity: .85; line-height: 1.35; white-space: nowrap; }
  .hero b { font-family: var(--num); font-size: 17px; line-height: 1.25; font-weight: 700; white-space: nowrap; }
  @container insp (min-width: 930px) {
    .strip { grid-template-columns: minmax(170px, 1.35fr) minmax(140px, 1.15fr) repeat(5, minmax(0, 1fr)); }
    .strip .use { display: flex; }
  }
  @container insp (max-width: 690px) {
    .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 60px; height: auto; }
  }

  .list { flex: 1; min-height: 0; background: var(--card); border-radius: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
  .tabs { display: flex; gap: 30px; padding: 14px 24px 0; border-bottom: 1px solid var(--hair); flex: none; }
  .tab { padding: 3px 1px 10px; font-size: 15px; color: var(--ink-3); border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab:hover { color: var(--ink-2); }
  .tab.on { color: var(--blue); border-color: var(--blue); font-weight: 600; }
  .rows { overflow: auto; padding: 12px 14px 14px; flex: 1; }
  .row { width: 100%; text-align: left; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 1px 14px; padding: 13px 16px; border-radius: 18px; background: var(--tile); margin-bottom: 9px; transition: background .12s; }
  .row:hover, .row.hl { background: var(--blue-soft); }
  .no { grid-row: span 3; width: 38px; height: 38px; border-radius: 13px; background: #fff; display: grid; place-items: center; font-family: var(--num); font-weight: 700; font-size: 15px; color: var(--ink-2); box-shadow: 0 2px 6px rgba(38, 48, 110, .08); }
  .row.want .no { background: var(--blue); color: #fff; box-shadow: none; }
  .t { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t em { font-style: normal; font-weight: 400; font-size: 12px; color: var(--ink-3); margin-left: 8px; }
  .sc { font-family: var(--num); font-size: 18px; font-weight: 700; text-align: right; line-height: 1.3; }
  .x { grid-column: 2; color: var(--ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.open .x { white-space: normal; }
  .mv { grid-column: 3; font-size: 12px; font-weight: 600; text-align: right; color: var(--ink-3); white-space: nowrap; }
  .mv.up { color: var(--up); } .mv.down { color: var(--down); }
  .chips { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .c { background: var(--chip); color: var(--ink-2); border-radius: 9px; padding: 1px 9px; font-size: 12px; white-space: nowrap; }
  .c.now { background: var(--blue); color: #fff; }
  .c.w { background: #fff3da; color: #9a6200; }
  .line { display: flex; align-items: center; gap: 10px; color: var(--blue); font-size: 12px; font-weight: 600; margin: 3px 8px 12px; white-space: nowrap; }
  .line::before, .line::after { content: ""; height: 1px; background: #c8d3ff; flex: 1; }

  /* 收起对话 */
  .fold { width: 34px; height: 34px; border-radius: 11px; background: rgba(255, 255, 255, .72); color: var(--ink-2); display: grid; place-items: center; flex: none; }
  .fold:hover { background: #fff; color: var(--blue); }
  .fold svg.i { width: 18px; height: 18px; }
  .app.folded { --chat: 66px; }
  .app.navfold { --nav: 58px; }
  .app.folded .chat { padding: 14px 16px 14px 14px; }
  .app.folded .chat .head { margin: 2px 0; justify-content: center; }
  .app.folded .chat h1, .app.folded .msgs, .app.folded .composer, .app.folded .note { display: none; }

    .scrim { display: none; }
  @media (max-width: 980px) {
    .app, .app.folded { --chat: 0px; grid-template-columns: var(--nav) minmax(0, 1fr); }
    .fold { display: none; }
    .app.folded .chat h1, .app.folded .msgs, .app.folded .composer, .app.folded .note { display: revert; }
    .insp { position: fixed; z-index: 5; top: 0; right: 0; width: min(760px, calc(100vw - 40px)); padding: 14px; background: #eef0fb; box-shadow: -18px 0 40px -20px rgba(38, 48, 110, .45); transform: translateX(105%); visibility: hidden; transition: transform .18s, visibility .18s; }
    .insp.open { transform: none; visibility: visible; }
    .close { display: grid; }
    .scrim.open { display: block; position: fixed; inset: 0; z-index: 4; background: rgba(20, 23, 43, .25); }
  }
  @media (max-width: 760px) {
    .app, .app.folded { grid-template-columns: minmax(0, 1fr); }
    .rail { display: none; }
    .insp { width: 100vw; }
    .ihead .pick { display: none; }
  }
</style>
</head>

  <symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9.500c-.5-1.200-1.600-1.800-3-1.800-1.700 0-3 .9-3 2.200 0 3 6 1.500 6 4.300 0 1.300-1.300 2.100-3 2.100-1.500 0-2.700-.7-3.100-1.900M12 6v12"/></symbol>

  <symbol id="upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>

  <symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<div class="app">
  <nav class="rail" aria-label="主导航">
    <div class="brand">
      <div class="logo"><svg class="i"><use href="#spark"/></svg></div>
      <b>Customer Agent</b>
      <button class="navbtn" id="navfold" aria-expanded="true" aria-label="收起菜单" title="收起菜单"><svg class="i"><use href="#panel"/></svg></button>
    </div>
    <button class="proj" title="切换项目"><i>格</i><span>当前项目<b>示例商店</b></span><svg class="i"><use href="#down"/></svg></button>
    <div class="menu">
      <div class="grp">
        <h6>知识库</h6>
        <a href="knowledge.html"><svg class="i"><use href="#db"/></svg><span>数据集</span></a>
        <a href="import.html"><svg class="i"><use href="#upload"/></svg><span>导入和解析</span></a>
        <a href="chunk-lab.html"><svg class="i"><use href="#cut"/></svg><span>切块实验室</span></a>
        <a href="jobs.html"><svg class="i"><use href="#tasks"/></svg><span>任务</span></a>
      </div>
      <div class="grp">
        <h6>检索与评测</h6>
        <a href="playground.html" class="on" aria-current="page"><svg class="i"><use href="#flask"/></svg><span>检索测试台</span></a>
        <a href="evals.html"><svg class="i"><use href="#chart"/></svg><span>评测</span></a>
      </div>
      <div class="grp">
        <h6>客服运营</h6>
        <a href="#"><svg class="i"><use href="#chat"/></svg><span>会话记录</span><em>第二步</em></a>
        <a href="#"><svg class="i"><use href="#headset"/></svg><span>转人工</span><em>第二步</em></a>
      </div>
      <div class="grp">
        <h6>用量与接入</h6>
        <a href="#"><svg class="i"><use href="#coin"/></svg><span>用量和花费</span><em>第二步</em></a>
        <a href="#"><svg class="i"><use href="#plug"/></svg><span>接入方</span></a>
      </div>
    </div>
    <div class="dock">
      <button aria-label="通知" title="通知"><svg class="i"><use href="#bell"/></svg></button>
      <button class="keep" aria-label="设置" title="设置"><svg class="i"><use href="#gear"/></svg></button>
      <button aria-label="搜索" title="搜索"><svg class="i"><use href="#find"/></svg></button>

  </nav>

  <main class="chat">
    <div class="head">
      <h1>检索测试台</h1>
      <button class="fold" id="fold" aria-expanded="true" aria-label="收起对话" title="收起对话"><svg class="i"><use href="#left"/></svg></button>
    </div>

    <div class="msgs" id="msgs"><div class="thread" id="thread"></div></div>

    <form class="composer" id="form">
      <textarea id="q" aria-label="问题" placeholder="问一个买家可能问的问题"></textarea>
      <div class="tools" id="tools">
        <button type="button" class="tg on" aria-pressed="true"><svg class="i"><use href="#pen"/></svg>改写</button>
        <button type="button" class="tg on" aria-pressed="true"><svg class="i"><use href="#brain"/></svg>语义</button>
        <button type="button" class="tg on" aria-pressed="true"><svg class="i"><use href="#key"/></svg>关键词</button>
        <button type="button" class="tg on" aria-pressed="true"><svg class="i"><use href="#merge"/></svg>融合</button>
        <button type="button" class="tg on" aria-pressed="true"><svg class="i"><use href="#sort"/></svg>重排</button>
        <button class="send" aria-label="发送"><svg class="i"><use href="#send"/></svg></button>
      </div>
    </form>
    <p class="note">效果图：内容和数字都是示意，不是实测结果。</p>
  </main>

  <div class="scrim" id="scrim"></div>

  <aside class="insp" id="insp" aria-label="检索过程">
    <div class="ihead">
      <h2>检索过程</h2>
      <span class="iq" id="iq"></span>
      <button class="pick">知识库 <b>示例商店 · 帮助</b><svg class="i"><use href="#down"/></svg></button>
      <button class="pick">索引 <b>v3 · bge-m3</b><svg class="i"><use href="#down"/></svg></button>
      <button class="close" id="close" aria-label="关闭"><svg class="i"><use href="#x"/></svg></button>
    </div>
    <div class="strip">
      <div class="g">
        <svg viewBox="0 0 172 96" id="gauge" aria-hidden="true"></svg>
        <div><b id="pct"></b><span>最高相关度</span></div>
      </div>
      <div class="hero"><span>交给模型</span><b id="given"></b></div>
      <div class="mini good"><span>应找到</span><b><i id="wantRank"></i><small>名</small></b></div>
      <div class="mini"><span>检索</span><b><i id="ms"></i><small>ms</small></b></div>
      <div class="mini"><span>回答</span><b><i id="sec"></i><small>s</small></b></div>
      <div class="mini use"><span>读入 / 写出</span><b><i id="tok"></i><small>token</small></b></div>
      <div class="mini"><span>本次花费</span><b><i id="cost"></i></b></div>
    </div>
    <div class="list">
      <div class="tabs" id="tabs">
        <button class="tab on" data-v="final">最终排名</button>
        <button class="tab" data-v="sem">语义检索</button>
        <button class="tab" data-v="kw">关键词</button>
        <button class="tab" data-v="rrf">融合</button>
      </div>
      <div class="rows" id="rows"></div>
    </div>
  </aside>
</div>

<script>
  var docs = {
    a: { t: '自动发货说明', p: '帮助 › 交付', x: '自动发货的商品在付款到账后立即交付，通常在一分钟内，卡密会显示在订单页并发到下单邮箱。' },
    b: { t: '付款后没收到怎么办', p: '常见问题 › 交付', x: '先在「查订单」里看订单状态。显示已交付时，卡密在订单页；显示待付款时，说明付款还没到账。' },
    c: { t: '人工交付的商品', p: '帮助 › 交付', x: '标有「人工交付」的商品由客服处理后交付，处理时间见商品页说明。' },
    d: { t: 'USDT 付款要等多久', p: '常见问题 › 付款', x: '链上转账需要网络确认，一般几分钟。确认后订单自动变为已付款。' },
    e: { t: 'ChatGPT Plus 月卡', p: '商品介绍', x: '一个月的 Plus 订阅兑换码，付款后自动发货，在兑换页输入即可开通。' },
    f: { t: 'Plus 月卡和 Go 月卡的区别', p: '常见问题 › 选购', x: 'Plus 月卡包含的模型和额度更多，Go 月卡价格更低，适合轻度使用。' },
    g: { t: '支持哪些付款方式', p: '常见问题 › 付款', x: '支持支付宝、微信、USDT 和账户余额。' }
  };

  // 每行：文档，语义名次和分，关键词名次和分，重排分。融合名次按 RRF（k=60）现算。
  function trace(rows) {
    var list = rows.map(function (r) {
      return { id: r[0], sem: r[1], semS: r[2], kw: r[3], kwS: r[4], finS: r[5], rrfS: 1 / (60 + r[1]) + 1 / (60 + r[3]) };
    });
    list.slice().sort(function (x, y) { return y.rrfS - x.rrfS; }).forEach(function (d, i) { d.rrf = i + 1; });
    list.slice().sort(function (x, y) { return y.finS - x.finS; }).forEach(function (d, i) { d.final = i + 1; });
    return list;
  }

  var turns = [
    { q: 'Plus 月卡付款后多久能收到？', rewrite: '', ms: 412, sec: '2.1', chars: 620, tok: '1.3k / 96', cost: '¥0.004', want: 'a',
      a: ['Plus 月卡是自动发货的商品，付款到账后立即交付，通常在一分钟内[1][3]。卡密会显示在订单页，同时发到下单邮箱[1]。', '如果过了一段时间还没收到，可以在「查订单」里看订单状态[2]。'],
      rows: trace([['a',1,.742,4,7.4,.981],['b',2,.701,2,9.8,.912],['e',5,.649,1,11.3,.874],['d',4,.654,8,3.9,.655],['c',3,.688,11,2.6,.603],['f',9,.571,3,8.9,.214],['g',14,.498,5,6.1,.118]]) },
    { q: '那用 USDT 付呢？', rewrite: 'USDT 付款后 Plus 月卡多久能收到', ms: 486, sec: '1.8', chars: 574, tok: '1.2k / 82', cost: '¥0.003', want: 'd',
      a: ['用 USDT 付款时，链上转账要等网络确认，一般几分钟，确认后订单自动变为已付款[1]。', '到账之后和其他付款方式一样立即交付，卡密在订单页[2]。'],
      rows: trace([['d',1,.803,1,12.6,.968],['a',3,.690,6,5.2,.842],['b',2,.712,4,7.1,.790],['g',4,.655,2,10.4,.402],['e',5,.631,3,8.8,.377],['c',6,.602,13,2.1,.151],['f',12,.533,5,5.9,.102]]) }
  ];

  var cur = 1, view = 'final';
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function renderThread() {
    var html = '';
    turns.forEach(function (t, i) {
      html += '<div class="turn' + (i === cur ? ' sel' : '') + '" data-i="' + i + '"><div class="me">' + esc(t.q) + '</div>';
      html += '<div class="ai"><div class="ava"><svg class="i"><use href="#spark"/></svg></div><div class="bub">';
      if (t.pending) {
        html += '<span class="dots"><i></i><i></i><i></i></span>';
      } else {
        html += t.a.map(function (p) {
          return '<p>' + esc(p).replace(/\[(\d)\]/g, '<button class="cite" data-r="$1" aria-label="出处 $1">$1</button>') + '</p>';
        }).join('');
        html += '<div class="meta"><span>检索 ' + t.ms + ' ms</span><span>·</span><span>回答 ' + t.sec + ' s</span><span>·</span><span>用了 ' + 5 + ' 块</span>' +
          '<button class="trace">检索过程<svg class="i"><use href="#right"/></svg></button></div>';
      }
      html += '</div></div></div>';
    });
    $('thread').innerHTML = html;
  }

  var views = {
    final: { s: 'finS', f: function (v) { return v.toFixed(3); } },
    sem: { s: 'semS', f: function (v) { return v.toFixed(3); } },
    kw: { s: 'kwS', f: function (v) { return v.toFixed(1); } },
    rrf: { s: 'rrfS', f: function (v) { return v.toFixed(4); } }
  };

  function renderRows() {
    var t = turns[cur], v = views[view], html = '';
    t.rows.slice().sort(function (x, y) { return x[view] - y[view]; }).forEach(function (d) {
      var doc = docs[d.id], want = d.id === t.want, n = d.rrf - d.final, move = '<span class="mv"></span>';
      if (view === 'final') move = n > 0 ? '<span class="mv up">▲ ' + n + '</span>' : n < 0 ? '<span class="mv down">▼ ' + (-n) + '</span>' : '<span class="mv">持平</span>';
      function chip(k, label) { return '<span class="c' + (k === view ? ' now' : '') + '">' + label + ' 第 ' + d[k] + '</span>'; }
      html += '<button class="row' + (want ? ' want' : '') + '" data-id="' + d.id + '"><span class="no">' + d[view] + '</span>' +
        '<span class="t">' + doc.t + '<em>' + doc.p + '</em></span><span class="sc">' + v.f(d[v.s]) + '</span>' +
        '<span class="x">' + doc.x + '</span>' + move +
        '<span class="chips">' + chip('sem', '语义') + chip('kw', '关键词') + chip('rrf', '融合') + chip('final', '重排') +
        (want ? '<span class="c w">★ 应找到</span>' : '') + '</span></button>';
      if (view === 'final' && d.final === 5) html += '<div class="line">以上 5 块交给模型</div>';
    });
    $('rows').innerHTML = html;
    $('rows').scrollTop = 0;
  }

  function setTab(v) {
    view = v;
    document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x.dataset.v === v); });
    renderRows();
  }

  function gauge(value) {
    var total = 15, cx = 86, cy = 88, html = '';
    for (var i = 0; i < total; i++) {
      var gap = .045, a0 = Math.PI + (i + gap) / total * Math.PI, a1 = Math.PI + (i + 1 - gap) / total * Math.PI;
      var p = [[84, a0], [84, a1], [62, a1], [62, a0]].map(function (q) { return (cx + q[0] * Math.cos(q[1])).toFixed(1) + ' ' + (cy + q[0] * Math.sin(q[1])).toFixed(1); });
      var fill = (i + .5) / total <= value ? (i < 9 ? '#1b3fe0' : '#2d5bff') : '#d9e0fb';
      html += '<path d="M' + p[0] + ' A84 84 0 0 1 ' + p[1] + ' L' + p[2] + ' A62 62 0 0 0 ' + p[3] + ' Z" fill="' + fill + '" stroke="' + fill + '" stroke-width="3" stroke-linejoin="round"/>';
    }
    $('gauge').innerHTML = html;
  }

  function renderInspector() {
    var t = turns[cur], top = Math.max.apply(null, t.rows.map(function (r) { return r.finS; }));
    var w = t.rows.filter(function (r) { return r.id === t.want; })[0];
    $('iq').textContent = t.rewrite ? t.q + '  →  改写为：' + t.rewrite : t.q;
    $('iq').title = $('iq').textContent;
    $('pct').textContent = Math.round(top * 100) + '%';
    $('wantRank').textContent = w ? '第 ' + w.final : '—';
    $('tok').textContent = t.tok; $('cost').textContent = t.cost;
    $('ms').textContent = t.ms; $('sec').textContent = t.sec;
    $('given').textContent = '5 块 · ' + t.chars + ' 字';
    gauge(top);
    renderRows();
  }

  function select(i) {
    cur = i;
    document.querySelectorAll('.turn').forEach(function (el) { el.classList.toggle('sel', +el.dataset.i === i); });
    renderInspector();
  }
  function drawer(open) { $('insp').classList.toggle('open', open); $('scrim').classList.toggle('open', open); }

  $('thread').addEventListener('click', function (e) {
    var turn = e.target.closest('.turn');
    if (!turn || turns[+turn.dataset.i].pending) return;
    select(+turn.dataset.i);
    var c = e.target.closest('.cite');
    if (c) {
      drawer(true); setTab('final');
      var d = turns[cur].rows.filter(function (x) { return x.final === +c.dataset.r; })[0];
      var el = $('rows').querySelector('[data-id="' + d.id + '"]');
      el.scrollIntoView({ block: 'nearest' });
      el.classList.add('hl');
      setTimeout(function () { el.classList.remove('hl'); }, 1400);
    }
    if (e.target.closest('.trace')) drawer(true);
  });
  $('rows').addEventListener('click', function (e) { var r = e.target.closest('.row'); if (r) r.classList.toggle('open'); });
  $('tabs').addEventListener('click', function (e) { var t = e.target.closest('.tab'); if (t) setTab(t.dataset.v); });
  $('fold').addEventListener('click', function () {
    var folded = document.querySelector('.app').classList.toggle('folded');
    this.setAttribute('aria-expanded', !folded);
    this.setAttribute('aria-label', folded ? '展开对话' : '收起对话');
    this.title = folded ? '展开对话' : '收起对话';
    this.querySelector('use').setAttribute('href', folded ? '#right' : '#left');
  });
  $('tools').addEventListener('click', function (e) {
    var b = e.target.closest('.tg'); if (!b) return;
    b.setAttribute('aria-pressed', b.classList.toggle('on'));
  });
  $('close').addEventListener('click', function () { drawer(false); });
  $('scrim').addEventListener('click', function () { drawer(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') drawer(false); });

  function send() {
    var q = $('q').value.trim();
    if (!q) return;
    $('q').value = '';
    var base = turns[1];
    var t = { q: q, rewrite: '', ms: base.ms, sec: base.sec, chars: base.chars, tok: base.tok, cost: base.cost, want: '', rows: base.rows, pending: true,
      a: ['这里是模型的回答。效果图没有接真实检索，右边的检索过程沿用上一条的示意数据。'] };
    turns.push(t);
    cur = turns.length - 1;
    renderThread();
    $('msgs').scrollTop = $('msgs').scrollHeight;
    setTimeout(function () {
      t.pending = false;
      renderThread(); renderInspector();
      $('msgs').scrollTop = $('msgs').scrollHeight;
    }, 700);
  }
  $('form').addEventListener('submit', function (e) { e.preventDefault(); send(); });
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });

  function setNav(folded) {
    document.querySelector('.app').classList.toggle('navfold', folded);
    var b = $('navfold'), label = folded ? '展开菜单' : '收起菜单';
    b.setAttribute('aria-expanded', !folded);
    b.setAttribute('aria-label', label);
    b.title = label;
  }
  $('navfold').addEventListener('click', function () {
    setNav(!document.querySelector('.app').classList.contains('navfold'));
  });
  setNav(window.innerWidth < 1240);

  renderThread();
  renderInspector();
</script>
</body>
</html>
