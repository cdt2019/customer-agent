<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据集 · 效果图</title>
<style>
  :root {
    --ink: #14172b; --ink-2: #545a78; --ink-3: #8e93ad;
    --blue: #2d5bff; --blue-deep: #1b3fe0; --blue-soft: #e8edff;
    --chip: #eceefa; --card: #ffffff; --tile: #f6f7fd; --hair: rgba(38, 48, 110, .07);
    --up: #12996a; --down: #e0475c;
    --shadow: 0 1px 2px rgba(38, 48, 110, .04), 0 12px 32px -14px rgba(38, 48, 110, .18);
    --shadow-blue: 0 14px 26px -12px rgba(36, 76, 245, .6);
    --num: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); overflow: hidden;
    font: 14px/1.55 "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    background: linear-gradient(180deg, #c6cbf0 0, #dfe2f7 150px, #f3f4fc 340px, #fafbff 100%) fixed;
    -webkit-font-smoothing: antialiased;
  }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .app { display: grid; --nav: 232px; --chat: 410px; grid-template-columns: var(--nav) var(--chat) minmax(0, 1fr); height: 100vh; }

  /* 左侧菜单 */
  .rail { height: 100vh; min-width: 0; background: rgba(255, 255, 255, .66); backdrop-filter: blur(16px); border-right: 1px solid rgba(38, 48, 110, .08); display: flex; flex-direction: column; padding: 14px 10px 10px; position: relative; z-index: 3; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 4px 12px 6px; }
  .logo { width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(145deg, #4a76ff, var(--blue-deep)); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 14px -7px rgba(36, 76, 245, .7); flex: none; }
  .logo svg.i { width: 16px; height: 16px; }
  .brand b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .navbtn { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-3); flex: none; }
  .navbtn:hover { background: var(--chip); color: var(--ink); }
  .navbtn svg.i { width: 17px; height: 17px; }
  .proj { width: 100%; display: flex; align-items: center; gap: 9px; text-align: left; background: #fff; border-radius: 13px; padding: 7px 9px; box-shadow: 0 1px 2px rgba(38, 48, 110, .06), 0 6px 14px -10px rgba(38, 48, 110, .3); margin-bottom: 8px; }
  .proj i { width: 28px; height: 28px; border-radius: 9px; background: var(--blue-soft); color: var(--blue); font-style: normal; font-weight: 700; font-size: 13px; display: grid; place-items: center; flex: none; }
  .proj span { flex: 1; min-width: 0; font-size: 11px; color: var(--ink-3); line-height: 1.25; }
  .proj b { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj > svg.i { width: 14px; height: 14px; color: var(--ink-3); }
  .menu { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .menu h6 { margin: 12px 8px 3px; font-size: 11px; line-height: 1.5; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
  .rail a { position: relative; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; margin-bottom: 2px; border-radius: 11px; color: var(--ink-2); text-decoration: none; white-space: nowrap; transition: background .12s, color .12s; }
  .rail a svg.i { width: 17px; height: 17px; stroke-width: 1.8; }
  .rail a:hover { background: rgba(38, 48, 110, .05); color: var(--ink); }
  .rail a:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  .rail a.on { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .rail a em { margin-left: auto; font-style: normal; font-size: 10.5px; font-weight: 400; color: var(--ink-3); background: var(--chip); border-radius: 6px; padding: 0 5px; }
  .dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 8px 0; }
  .dock button { height: 32px; border-radius: 10px; background: #fff; color: var(--ink-2); display: grid; place-items: center; box-shadow: 0 1px 2px rgba(38, 48, 110, .07); }
  .dock button:hover { color: var(--blue); }
  .dock svg.i { width: 16px; height: 16px; }
  .me-card { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 13px; padding: 7px 9px; font-size: 13px; color: var(--ink-2); box-shadow: 0 1px 2px rgba(38, 48, 110, .06); }
  .me-card i { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(145deg, #4a76ff, var(--blue-deep)); color: #fff; font-style: normal; font-size: 12px; font-weight: 600; display: grid; place-items: center; flex: none; }
  .me-card span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me-card small { font-size: 10.5px; font-weight: 600; color: var(--ink-3); }

  .app.navfold .rail { padding: 14px 9px 10px; align-items: center; }
  .app.navfold .brand { flex-direction: column; padding: 0 0 8px; }
  .app.navfold .brand b, .app.navfold .proj span, .app.navfold .proj > svg.i, .app.navfold .menu h6, .app.navfold .rail a em, .app.navfold .me-card span, .app.navfold .me-card small { display: none; }
  .app.navfold .proj { width: 40px; padding: 6px; justify-content: center; }
  .app.navfold .menu { width: 100%; overflow: visible; }
  .app.navfold .menu .grp + .grp { border-top: 1px solid var(--hair); margin-top: 6px; padding-top: 6px; }
  .app.navfold .rail a { width: 36px; padding: 0; margin-inline: auto; justify-content: center; }
  .app.navfold .rail a span { position: absolute; left: 44px; top: 50%; transform: translateY(-50%); background: var(--ink); color: #fff; font-size: 12px; font-weight: 400; line-height: 1; padding: 6px 8px; border-radius: 7px; opacity: 0; pointer-events: none; transition: opacity .1s; }
  .app.navfold .rail a:hover span, .app.navfold .rail a:focus-visible span { opacity: 1; }
  .app.navfold .dock { grid-template-columns: 1fr; width: 34px; }
  .app.navfold .dock button:not(.keep) { display: none; }
  .app.navfold .me-card { padding: 4px; }

  
  .app { grid-template-columns: var(--nav) minmax(0, 1fr); }
  .page { height: 100vh; min-width: 0; display: flex; flex-direction: column; padding: 14px 20px; }
  .head { flex: none; display: flex; align-items: center; gap: 8px; margin: 2px 2px 12px; flex-wrap: wrap; }
  .head h1 { font-size: 22px; line-height: 1.2; margin: 0 6px 0 0; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .pick { background: rgba(255, 255, 255, .72); border-radius: 12px; height: 34px; padding: 0 12px; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .pick b { color: var(--ink); font-weight: 600; }
  .pick svg.i { width: 14px; height: 14px; }
  .pick.sel { background: #fff; color: var(--blue); font-weight: 600; box-shadow: 0 1px 2px rgba(38, 48, 110, .08); }
  .sp { flex: 1; }
  .primary { height: 36px; padding: 0 20px; border-radius: 12px; color: #fff; font-weight: 600; background: linear-gradient(100deg, #4170ff, var(--blue-deep)); box-shadow: 0 10px 18px -10px rgba(36, 76, 245, .75); white-space: nowrap; }
  .primary:active { transform: translateY(1px); }
  .strip { flex: none; display: grid; gap: 9px; height: 72px; margin-bottom: 12px; }
  .mini { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); min-width: 0; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .mini > span { font-size: 11.5px; color: var(--ink-3); line-height: 1.35; white-space: nowrap; }
  .mini b { font-family: var(--num); font-size: 19px; line-height: 1.25; font-weight: 700; white-space: nowrap; }
  .mini b small { font-size: 11px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
  .mini.hero { color: #fff; background: radial-gradient(120% 160% at 88% 0, #6f92ff 0, transparent 56%), linear-gradient(105deg, #2f5eff, var(--blue-deep)); box-shadow: 0 12px 20px -12px rgba(36, 76, 245, .7); }
  .mini.hero > span { color: rgba(255, 255, 255, .85); }
  .mini.hero b small { color: rgba(255, 255, 255, .85); }
  .panel { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .tabs { display: flex; gap: 24px; padding: 13px 20px 0; border-bottom: 1px solid var(--hair); flex: none; overflow-x: auto; }
  .tab { padding: 2px 1px 9px; font-size: 14px; color: var(--ink-3); border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab:hover { color: var(--ink-2); }
  .tab.on { color: var(--blue); border-color: var(--blue); font-weight: 600; }
  .c { background: var(--chip); color: var(--ink-2); border-radius: 8px; padding: 0 8px; font-size: 12px; white-space: nowrap; }
  .note { flex: none; margin: 8px 2px 0; font-size: 11.5px; color: var(--ink-3); }
  .scroll { overflow: auto; flex: 1; min-height: 0; }

  .strip { grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(160px, 1.35fr); }
  .work { flex: 1; min-height: 0; display: grid; grid-template-columns: 318px minmax(0, 1fr); gap: 12px; }
  .find { margin: 12px 12px 8px; height: 38px; border-radius: 13px; background: var(--tile); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--ink-3); flex: none; }
  .find svg.i { width: 16px; height: 16px; }
  .find input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; color: var(--ink); }
  .filters { display: flex; gap: 5px; padding: 0 12px 9px; flex: none; flex-wrap: wrap; }
  .f { height: 26px; padding: 0 10px; border-radius: 9px; background: var(--tile); color: var(--ink-2); font-size: 12.5px; }
  .f.on { background: var(--blue); color: #fff; font-weight: 600; }
  .docs { padding: 0 8px 8px; }
  .doc { width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; padding: 9px 11px; border-radius: 14px; margin-bottom: 3px; }
  .doc:hover { background: var(--tile); }
  .doc.on { background: var(--blue-soft); }
  .doc b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc.on b { color: var(--blue-deep); }
  .doc > span { color: var(--ink-3); font-size: 12px; }
  .doc .n { text-align: right; white-space: nowrap; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #e7a11a; margin-right: 5px; vertical-align: 2px; }
  .dhead { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 20px 11px; border-bottom: 1px solid var(--hair); }
  .dhead h2 { margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dhead .sp { min-width: 8px; }
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .side { min-height: 0; display: flex; flex-direction: column; min-width: 0; }
  .side + .side { border-left: 1px solid var(--hair); background: #fbfbfe; }
  .side h3 { flex: none; margin: 0; padding: 10px 20px 6px; font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
  .src { padding: 2px 14px 16px; }
  .seg { display: block; padding: 7px 10px 7px 12px; border-left: 3px solid #c6d3ff; border-radius: 0 10px 10px 0; margin-bottom: 4px; line-height: 1.75; transition: background .1s, border-color .1s; }
  .seg:nth-child(even) { border-left-color: #8ea6ff; }
  .seg h4 { margin: 0 0 1px; font-size: 14px; font-weight: 700; }
  .seg p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
  .seg.hl { background: var(--blue-soft); border-left-color: var(--blue); }
  .chunks { padding: 2px 14px 16px; }
  .chunk { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 15px; background: #fff; box-shadow: 0 1px 2px rgba(38, 48, 110, .07); margin-bottom: 8px; outline: 1.5px solid transparent; outline-offset: -1.5px; transition: background .1s, outline-color .1s; }
  .chunk.hl { background: var(--blue-soft); outline-color: #8ea6ff; }
  .chunk .top { display: flex; align-items: center; gap: 8px; }
  .chunk .no { width: 24px; height: 24px; border-radius: 8px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; font-family: var(--num); font-weight: 700; font-size: 12px; flex: none; }
  .chunk .path { flex: 1; min-width: 0; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chunk .len { font-family: var(--num); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .chunk .bar { display: block; height: 4px; border-radius: 9px; background: #e3e7f8; margin: 7px 0; overflow: hidden; }
  .chunk .bar i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, #6f92ff, var(--blue-deep)); }
  .chunk .x { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink-2); font-size: 12.5px; line-height: 1.55; }
  .chunk.open .x { display: block; }
  @media (max-width: 1240px) {
    .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 58px; height: auto; }
    .work { grid-template-columns: 250px minmax(0, 1fr); }
  }
  @media (max-width: 860px) {
    body { overflow: auto; } .app { height: auto; } .rail { position: sticky; top: 0; }
    .page { height: auto; } .work { grid-template-columns: minmax(0, 1fr); } .docs { max-height: 240px; }
    .split { grid-template-columns: minmax(0, 1fr); } .side + .side { border-left: 0; border-top: 1px solid var(--hair); }
  }

</style>
</head>

  <main class="page">

      <button class="pick">示例商店 · 规划文档（练习）</button>
      <span class="sp"></span>

      <a class="pick" href="http://localhost:6333/dashboard" target="_blank" rel="noopener" style="text-decoration:none" title="打开 Qdrant 自带面板的 Visualize">向量地图</a>
      <button class="pick" id="rebuild">全部重建</button>

    <div class="strip">
      <div class="mini"><span>文档</span><b>42<small>篇</small></b></div>
      <div class="mini"><span>块</span><b>318<small>块</small></b></div>
      <div class="mini"><span>平均长度</span><b>286<small>字</small></b></div>
      <div class="mini"><span>待更新</span><b>2<small>篇</small></b></div>
      <div class="mini"><span>向量模型</span><b style="font-size:16px">bge-m3</b></div>
      <div class="mini hero"><span>上次同步</span><b id="synced">6 分钟前</b></div>
    </div>
    <div class="work">
      <section class="panel">
        <label class="find"><svg class="i"><use href="#find"/></svg><input id="q" aria-label="搜索文档" placeholder="搜索文档"></label>
        <div class="filters" id="filters"></div>
        <div class="docs scroll" id="docs"></div>

        <div class="dhead"><h2 id="dt"></h2><span class="c" id="dtype"></span><span class="c" id="dcount"></span><span class="sp"></span><a class="pick" href="playground.html" style="text-decoration:none">去测试台提问</a></div>
        <div class="split">
          <div class="side"><h3>原文</h3><div class="src scroll" id="src"></div></div>
          <div class="side"><h3>切出来的块</h3><div class="chunks scroll" id="chunks"></div></div>

<script>
  function setNav(folded) {
    document.querySelector('.app').classList.toggle('navfold', folded);
    var b = document.getElementById('navfold'), label = folded ? '展开菜单' : '收起菜单';
    b.setAttribute('aria-expanded', !folded); b.setAttribute('aria-label', label); b.title = label;
  }
  document.getElementById('navfold').addEventListener('click', function () { setNav(!document.querySelector('.app').classList.contains('navfold')); });
  setNav(window.innerWidth < 1240);

  var documents = [
    { t: '自动发货说明', k: '帮助', n: 3, dirty: false, s: [
      ['多久到货', '自动发货的商品在付款到账后立即交付，通常在一分钟内。卡密会显示在订单页，同时发到下单邮箱。'],
      ['没有收到邮件', '邮件可能进了垃圾箱。卡密始终可以在订单页查看，用下单邮箱在「查订单」里就能找回订单。'],
      ['人工交付的区别', '标有「人工交付」的商品由客服处理后交付，处理时间写在商品页。付款后订单会显示为处理中。']
    ]},
    { t: '付款后没收到怎么办', k: '常见问题', n: 2, dirty: true, s: [
      ['先看订单状态', '在「查订单」里看订单状态。显示已交付时，卡密在订单页；显示待付款时，说明付款还没到账。'],
      ['付款了但显示待付款', '先不要重复付款。等几分钟后刷新；仍未变化时，可以发起售后并附上付款截图，客服会核对到账情况。']
    ]},
    { t: 'USDT 付款要等多久', k: '常见问题', n: 2, dirty: false, s: [
      ['到账时间', '链上转账需要网络确认，一般几分钟。确认后订单自动变为已付款。'],
      ['金额或网络不对', '转账金额或网络和收银台显示的不一致时，系统无法自动入账，这类情况由客服人工核对。']
    ]},
    { t: '质保和补发规则', k: '帮助', n: 3, dirty: true, s: [
      ['质保从什么时候算', '质保期从交付时间开始计算，每个商品的质保天数写在商品页。'],
      ['怎么申请', '在订单页点「申请售后」，选择质保补发并说明情况，可以附截图。'],
      ['谁来判断', '是否符合质保由客服核对后确认，符合的会从库存补发一份新的卡密。']
    ]},
    { t: 'ChatGPT Plus 月卡', k: '商品', n: 2, dirty: false, s: [
      ['商品说明', '一个月的 Plus 订阅兑换码，付款后自动发货。'],
      ['怎么使用', '在兑换页输入兑换码和账号信息即可开通，具体步骤见使用教程。']
    ]},
    { t: 'Plus 月卡和 Go 月卡的区别', k: '常见问题', n: 1, dirty: false, s: [
      ['怎么选', 'Plus 月卡包含的模型和额度更多，Go 月卡价格更低，适合轻度使用。']
    ]},
    { t: '支持哪些付款方式', k: '常见问题', n: 1, dirty: false, s: [
      ['付款方式', '支持支付宝、微信、USDT 和账户余额。支付宝和微信可能收取通道手续费，以收银台显示为准。']
    ]},
    { t: '售后与退款政策', k: '法务', n: 2, dirty: false, s: [
      ['适用范围', '本政策适用于在本站购买的数字商品。卡密一经查看，退款按本政策条款处理。'],
      ['处理方式', '退款申请由客服审核后处理，可以退回原付款方式或账户余额。']
    ]}
  ];
  var kinds = ['全部', '帮助', '常见问题', '法务', '商品'], kind = '全部', cur = 0;
  var $ = function (id) { return document.getElementById(id); };

  function renderFilters() {
    $('filters').innerHTML = kinds.map(function (k) { return '<button class="f' + (k === kind ? ' on' : '') + '" data-k="' + k + '">' + k + '</button>'; }).join('');
  }
  function renderDocs() {
    var q = $('q').value.trim(), html = '';
    documents.forEach(function (d, i) {
      if ((kind !== '全部' && d.k !== kind) || (q && d.t.indexOf(q) < 0)) return;
      html += '<button class="doc' + (i === cur ? ' on' : '') + '" data-i="' + i + '"><b>' + d.t + '</b><span class="n">' + d.n + ' 块</span><span>' + (d.dirty ? '<i class="dot"></i>待更新 · ' : '') + d.k + '</span></button>';
    });
    $('docs').innerHTML = html || '<p style="color:var(--ink-3);padding:12px;margin:0">没有匹配的文档</p>';
  }
  function renderDoc() {
    var d = documents[cur];
    $('dt').textContent = d.t; $('dtype').textContent = d.k; $('dcount').textContent = d.n + ' 块';
    $('src').innerHTML = d.s.map(function (x, i) { return '<div class="seg" data-c="' + i + '"><h4>' + x[0] + '</h4><p>' + x[1] + '</p></div>'; }).join('');
    $('chunks').innerHTML = d.s.map(function (x, i) {
      var len = x[0].length + d.t.length + x[1].length + 3;
      return '<button class="chunk" data-c="' + i + '"><span class="top"><span class="no">' + (i + 1) + '</span><span class="path">' + d.t + ' › ' + x[0] + '</span><span class="len">' + len + ' 字</span></span><span class="bar"><i style="width:' + Math.min(100, Math.round(len / 4)) + '%"></i></span><span class="x">' + x[1] + '</span></button>';
    }).join('');
  }
  function mark(c) { document.querySelectorAll('.seg, .chunk').forEach(function (e) { e.classList.toggle('hl', e.dataset.c === c); }); }
  ['src', 'chunks'].forEach(function (id) {
    $(id).addEventListener('mouseover', function (e) { var t = e.target.closest('[data-c]'); mark(t ? t.dataset.c : null); });
    $(id).addEventListener('mouseleave', function () { mark(null); });
  });
  $('chunks').addEventListener('click', function (e) { var c = e.target.closest('.chunk'); if (c) c.classList.toggle('open'); });
  $('docs').addEventListener('click', function (e) { var b = e.target.closest('.doc'); if (!b) return; cur = +b.dataset.i; renderDocs(); renderDoc(); });
  $('filters').addEventListener('click', function (e) { var b = e.target.closest('.f'); if (!b) return; kind = b.dataset.k; renderFilters(); renderDocs(); });
  $('q').addEventListener('input', renderDocs);
  $('sync').addEventListener('click', function () {
    var b = this; b.disabled = true; b.textContent = '同步中…';
    setTimeout(function () {
      documents.forEach(function (d) { d.dirty = false; });
      document.querySelectorAll('.mini b')[3].innerHTML = '0<small>篇</small>';
      $('synced').textContent = '刚刚'; b.disabled = false; b.textContent = '现在同步'; renderDocs();
    }, 800);
  });
  renderFilters(); renderDocs(); renderDoc();

</script>
</body>
</html>
